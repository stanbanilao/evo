<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Step inside the connected product worlds of Thynkverse.">
  <title>Thynkverse Evo — Product worlds in motion</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23080a0d'/%3E%3Ccircle cx='32' cy='32' r='19' fill='%23ff6b35'/%3E%3Cellipse cx='32' cy='34' rx='12' ry='9' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" id="stage">
    <div class="ambient" aria-hidden="true"></div>
    <section class="intro" id="intro" aria-label="Thynkverse introduction">
      <div class="brand brand--intro" aria-label="thynkverse"><span>thynk</span><b>verse</b></div>
      <div class="portal" aria-hidden="true"><i></i><i></i><i></i></div>
      <img class="tivi tivi--hero" src="assets/tivi-wave.png" alt="Tivi, the Thynkverse guide, waving">
      <div class="intro-copy">
        <p>Different worlds of work.</p>
        <p>One connected <strong>Thynkverse.</strong></p>
      </div>
      <button class="enter" id="enterBtn">Enter the Thynkverse</button>
    </section>

    <section class="player" id="player" aria-label="Thynkverse product showcase">
      <header class="topline">
        <button class="brand" id="homeBtn" aria-label="Return to the Thynkverse opening"><span>thynk</span><b>verse</b></button>
        <p class="eyebrow">Product world <span id="worldCount">01 / 05</span></p>
      </header>

      <nav class="product-tabs" id="productTabs" aria-label="Choose a product"></nav>

      <div class="world" id="world">
        <div class="world-heading">
          <div>
            <p class="kicker" id="productKicker"></p>
            <h1 id="productTitle"></h1>
          </div>
          <p class="summary" id="productSummary"></p>
        </div>

        <div class="cinema" id="cinema">
          <div class="screen-glow"></div>
          <div class="screen-frame" id="screenFrame">
            <div class="mock-screen" id="mockScreen"></div>
            <div class="spotlight" id="spotlight"></div>
            <div class="cursor" id="cursor"><span></span></div>
          </div>
          <img class="tivi tivi--side" id="sideTivi" src="assets/tivi-connect.png" alt="Tivi guiding the product showcase">
          <div class="caption" id="caption" aria-live="polite"></div>
        </div>

        <aside class="chapters" id="chapters" aria-label="Showcase chapters">
          <button class="chapters-toggle" id="chaptersToggle" aria-expanded="true">Scenes</button>
          <ol id="chapterList"></ol>
        </aside>
      </div>

      <div class="controls" id="controls">
        <button id="playBtn" aria-label="Pause showcase">Ⅱ</button>
        <div class="timeline"><span id="progress"></span></div>
        <span class="time" id="time">0:00 / 0:32</span>
        <button id="soundBtn" aria-label="Mute narration">Sound</button>
        <button id="captionsBtn" aria-label="Hide subtitles" aria-pressed="true">CC</button>
        <button id="fullBtn" aria-label="Enter full screen">Full</button>
      </div>
    </section>

    <div class="rotate-hint" aria-hidden="true"><span>↻</span><p>Rotate your phone<br>for the full experience.</p></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
